name: healthymate
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  gal: ^2.3.3
  image_picker: ^1.2.3
  crypto: ^3.0.3
  percent_indicator: ^4.2.3
  connectivity_plus: ^7.3.1
  internet_connection_checker_plus: ^3.1.2
  intl: ^0.19.0
  flutter_svg: ^2.3.0
  flutter_dotenv: ^6.0.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true
  assets:
    - HM.svg
    - assets/logo.png
    - .env

flutter_launcher_icons:
  android: "launch_background"
  ios: true
  image_path: "assets/logo.png"
  web:
    generate: true
    image_path: "assets/logo.png"

