name: healthymate
description: "แอปออกกำลังกายและสุขภาพ"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  google_maps_flutter: ^2.18.0
  geolocator: ^13.0.2
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  gal: ^2.3.3
  image_picker: ^1.2.3
  crypto: ^3.0.3
  percent_indicator: ^4.2.3
  connectivity_plus: ^6.1.4
  internet_connection_checker_plus: ^2.7.2
  intl: ^0.20.2
  flutter_svg: ^2.3.0
  flutter_dotenv: ^6.0.1
  google_sign_in: ^7.2.0
  flutter_background_service: ^5.1.0
  flutter_tts: ^4.2.5
  sign_in_with_apple: ^8.2.0
  local_auth: ^2.3.0
  device_info_plus: ^13.2.0
  health: ^13.3.2
  pdf: ^3.13.1
  csv: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - HM.svg
    - assets/logo.png
    - assets/fonts/
    - .env

flutter_launcher_icons:
  android: "launch_background"
  ios: true
  image_path: "assets/logo.png"
  web:
    generate: true
    image_path: "assets/logo.png"